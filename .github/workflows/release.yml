# Release pipeline (DEPLOYMENT.md §8).
#
# Triggered by pushing a version tag. Runs the test suites, builds the
# desktop app, and creates a DRAFT GitHub Release carrying the installer,
# its Ed25519 signature, and the latest.json manifest the updater reads.
#
# The release is deliberately left as a draft. Publishing it is what makes
# every installed copy see the update, so that stays a separate, deliberate,
# human step — not something a git push does.

name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs build and test without producing a release, which is the
  # cheap way to find out that a dependency broke the frozen build.
  workflow_dispatch:

permissions:
  contents: write        # Required to create the release

jobs:
  release:
    # Windows-only on purpose: the COM-port handling and the WebView2
    # dependency are Windows-specific and nothing here has been tested
    # elsewhere (DEPLOYMENT.md §13).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Annotated tag objects are needed to read the release note out
          # of the tag message below; a shallow checkout of the tag ref
          # does not reliably bring the tag object itself.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # Matches the development venv

      - uses: dtolnay/rust-toolchain@stable

      # Rust builds dominate the runtime here; without a cache every
      # release recompiles the whole Tauri dependency tree.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Freeze the backend
        working-directory: backend
        run: >
          python -m PyInstaller thrustbench-backend.spec --noconfirm
          --distpath dist_sidecar --workpath build_sidecar

      # Staged rather than referenced in place: tauri.conf.json's resource
      # path has to live under src-tauri.
      - name: Stage the backend for Tauri
        shell: pwsh
        run: |
          $staged = "src-tauri/resources/backend"
          if (Test-Path $staged) { Remove-Item $staged -Recurse -Force }
          New-Item -ItemType Directory -Path $staged -Force | Out-Null
          Copy-Item "backend/dist_sidecar/thrustbench-backend/*" $staged -Recurse -Force
          if (-not (Test-Path "$staged/thrustbench-backend.exe")) {
            throw "Staging failed - thrustbench-backend.exe is missing"
          }

      - name: Install root dependencies
        run: npm ci

      # The Updates panel shows this as the update's title: the one line
      # an operator reads before deciding to install. It comes from the
      # annotated tag's message, which is written for the release, rather
      # than the last commit subject, which is whatever happened to land
      # last (at v1.0.0 that was a formatting fix).
      #
      # The explicit re-fetch is required, not belt-and-braces.
      # actions/checkout resolves the tag and then re-fetches it as
      # `+<sha>:refs/tags/<tag>`, which force-replaces the annotated tag
      # object with a LIGHTWEIGHT tag pointing straight at the commit.
      # The tag message is gone by the time any later step runs, and
      # `%(contents:subject)` then yields the commit subject instead —
      # silently, with no error and a plausible-looking string.
      - name: Read the release note from the tag
        id: commit
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # Restore the real tag object that checkout clobbered.
          git fetch --force --no-recurse-submodules origin "refs/tags/${tag}:refs/tags/${tag}" || true

          subject=""
          if [ "$(git cat-file -t "refs/tags/${tag}" 2>/dev/null)" = "tag" ]; then
            subject="$(git tag -l --format='%(contents:subject)' "${tag}")"
            echo "Read release note from the annotated tag."
          else
            echo "::warning::${tag} is a lightweight tag - no tag message to read."
          fi

          if [ -z "${subject}" ]; then
            subject="$(git log -1 --pretty=%s)"
            echo "::warning::Falling back to the commit subject; this is what operators will see as the update title."
          fi

          echo "Release note: ${subject}"
          echo "subject=${subject}" >> "$GITHUB_OUTPUT"

      - name: Build, sign, and draft the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the build still produces an installer, but no
          # .sig — and an unsigned artifact is one every installed copy
          # refuses as an update (§6).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NWA Bench Console ${{ github.ref_name }}"
          # Becomes latest.json's "notes", which is what the Updates
          # panel renders as the update title.
          releaseBody: ${{ steps.commit.outputs.subject }}
          # Draft on purpose — see the header.
          releaseDraft: true
          prerelease: false
          # Emits latest.json alongside the installer; the updater has
          # nothing to read without it.
          includeUpdaterJson: true
