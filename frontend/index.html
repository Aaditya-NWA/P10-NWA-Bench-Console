<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Ensures correct scaling on high-DPI displays -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NWA Bench Console — motor torque and thrust test stand for Nautical Wings Aerospace" />
    <title>NWA Bench Console</title>

    <!-- Served from frontend/public/, which is copied to the site root
         verbatim. To change the icon, replace those files keeping the
         same names — no edit needed here. logo.png is also used by the
         header and sign-in screen, which fall back to an "NWA" text
         badge if it is missing. -->
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon.png" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Preconnect before the CSS @import fires, so the two font
         families aren't waiting on a fresh TLS handshake — otherwise
         the whole dashboard renders in the fallback face first and
         visibly reflows once Barlow Condensed lands. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <!-- React mounts into this div -->
    <div id="root"></div>
    <!-- Vite injects the bundled script here during dev and build -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
